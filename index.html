<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teaching Hours Plan · AHST · Beni-Suef University</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Playfair+Display:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b2545;--navy2:#13315c;--teal:#13a89e;--gold:#c9a227;--gold2:#f3e6b3;
  --ink:#1b2a3a;--mute:#6b7a8c;--paper:#fffdf9;--line:#e4e8ee;
  --cL:#13a89e;--cP:#4f6bed;--cT:#e6a117;--cF:#d6455d;
}
*{box-sizing:border-box;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{margin:0}
body{background:#e6eaf0;font-family:'Cairo',system-ui,sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.app{display:grid;grid-template-columns:390px 1fr;min-height:100vh}

/* ---------- control panel ---------- */
.panel{position:sticky;top:0;height:100vh;overflow:auto;padding:26px 24px 30px;color:#fff;
  background:radial-gradient(circle at 90% 0%,rgba(19,168,158,.35),transparent 45%),radial-gradient(circle at 0% 100%,rgba(201,162,39,.22),transparent 45%),linear-gradient(160deg,#0b2545,#0e3158 55%,#0f4c5c)}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:22px}
.brand .lg{width:54px;height:54px;border-radius:50%;background:#fff;display:grid;place-items:center;padding:3px;box-shadow:0 0 0 2px var(--gold)}
.brand h1{font-size:19px;margin:0;font-weight:800;line-height:1.25}
.brand small{display:block;color:#b9c8dc;font-weight:400;font-size:12px;margin-top:2px}
.step{margin-top:20px}
.step>label,.step>.lb{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--gold2);margin-bottom:8px}
.step .no{width:22px;height:22px;border-radius:50%;background:var(--gold);color:#0b2545;display:grid;place-items:center;font-size:12px;font-weight:800}
.panel input[type=text],.panel input[type=number]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;font:600 15px 'Cairo';outline:none;transition:.2s}
.panel input:focus{border-color:var(--gold);background:rgba(255,255,255,.14);box-shadow:0 0 0 3px rgba(201,162,39,.25)}
.panel input::placeholder{color:#8fa3bd;font-weight:400}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18)}
.seg button{border:0;border-radius:10px;padding:10px;font:700 14px 'Cairo';color:#cfe0f5;background:transparent;cursor:pointer;transition:.18s}
.seg button.on{background:linear-gradient(135deg,#f3d66b,#c9a227);color:#0b2545;box-shadow:0 4px 12px rgba(201,162,39,.35)}
.hint{font-size:12px;margin-top:7px;min-height:18px;color:#9fb3cc}
.hint.ok{color:#7ee2b8}.hint.bad{color:#ffb4a8}
.progs{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pc{cursor:pointer;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);border-radius:14px;padding:10px 11px;text-align:right;color:#fff;font-family:inherit;transition:.18s;position:relative;overflow:hidden}
.pc:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
.pc .cd{display:inline-block;font:700 11px 'Playfair Display',serif;letter-spacing:.08em;padding:2px 8px;border-radius:99px;color:#0b2545;background:var(--a)}
.pc b{display:block;margin-top:6px;font-size:12.5px;line-height:1.35;font-weight:700}
.pc.on{border-color:var(--gold);background:rgba(201,162,39,.16);box-shadow:inset 0 0 0 1px var(--gold)}
.pc.on::after{content:'✓';position:absolute;left:8px;top:6px;color:var(--gold);font-weight:800}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;margin-top:22px;padding:14px;border:0;border-radius:14px;font:800 16px 'Cairo';cursor:pointer;color:#0b2545;background:linear-gradient(135deg,#f3d66b,#c9a227);box-shadow:0 8px 22px rgba(201,162,39,.35);transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(201,162,39,.45)}
.mini{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mini div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px}
.mini b{display:block;font:800 22px 'Playfair Display',serif;color:var(--gold2)}
.mini span{font-size:11.5px;color:#b9c8dc}
.note{margin-top:14px;font-size:11.5px;color:#9fb3cc;line-height:1.7}

/* ---------- stage ---------- */
.stage{padding:26px 16px 40px;overflow-x:hidden}
.sheets{display:flex;flex-direction:column;align-items:center;gap:26px;transform-origin:top center}

/* ---------- A4 sheet ---------- */
.sheet{direction:ltr;width:210mm;height:297mm;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 18px 50px rgba(11,37,69,.22);display:flex;flex-direction:column;font-family:'Cairo',sans-serif;color:var(--ink);flex:none}
.sheet .bar{height:7px;background:linear-gradient(90deg,var(--navy),var(--teal) 55%,var(--gold))}
.hd{display:flex;align-items:center;justify-content:space-between;padding:14px 14mm 10px;border-bottom:1px solid var(--line)}
.hd .l{display:flex;align-items:center;gap:11px}
.hd .t1{font:700 12.5px 'Playfair Display',serif;color:var(--navy);line-height:1.25}
.hd .t2{font-size:9.5px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.chip{font:700 10px 'Playfair Display',serif;letter-spacing:.1em;padding:4px 11px;border-radius:99px;background:#e4e8ee;color:var(--navy)}
.chip.g{background:var(--gold);color:var(--navy)}
.stu{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:5px 18px;padding:6px 14mm 7px;background:#f3f5f8;border-bottom:1px solid var(--line);font-size:9.5px}
.stu span{display:flex;align-items:baseline;gap:7px;min-width:0}
.stu small{font-size:7.8px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:700;white-space:nowrap}
.stu b{color:var(--navy);font:700 11.5px 'Cairo';border-bottom:1.3px dotted #b7c1cf;padding:0 4px 1px;min-width:120px;unicode-bidi:plaintext}
.stu .pgr{flex:1 0 100%}
.stu .tg{font:700 9px 'Cairo';letter-spacing:.06em;padding:2px 10px;border-radius:99px;background:var(--gold);color:var(--navy);white-space:nowrap;align-self:center}
.stu .pgr b{flex:1;border-bottom-color:#d6c27a}
.stu .id b{letter-spacing:.1em;font-variant-numeric:tabular-nums;min-width:150px}
.ft{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding:9px 14mm 12px;border-top:1px solid var(--line);font-size:8.5px;color:var(--mute);letter-spacing:.03em}
.ft b{color:var(--navy)}
.body{padding:14px 14mm 6px;flex:1;min-height:0}

/* cover */
.cover-top{position:relative;height:104mm;color:var(--navy);padding:13mm 14mm 0;overflow:hidden;background-color:#e9ecf0;
  background:radial-gradient(circle at 88% 12%,rgba(19,168,158,.16),transparent 42%),radial-gradient(circle at 5% 95%,rgba(201,162,39,.18),transparent 42%),linear-gradient(135deg,#f1f3f6,#e3e7ec 60%,#dde3ea)}
.cover-top::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(11,37,69,.10) 1px,transparent 1.3px);background-size:16px 16px;opacity:.8}
.cover-top::after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--gold),#f3d66b,var(--gold))}
.cover-top>*{position:relative}
.eyebrow{font:700 10px 'Cairo';letter-spacing:.32em;text-transform:uppercase;color:#8a6d0a;margin-top:10px}
.cover-top h1{font:800 28px/1.15 'Playfair Display',serif;margin:8px 0 3px;letter-spacing:.2px;max-width:128mm}
.cover-top h2{font:500 17px 'Playfair Display',serif;margin:0;color:var(--navy2)}
.cover-top .rule{width:64px;height:3px;background:var(--gold);margin:16px 0 14px;border-radius:2px}
.cover-top .ttl{font:700 13px 'Cairo';letter-spacing:.2em;text-transform:uppercase;color:var(--navy)}
.cover-top .ttl span{color:#8a6d0a;margin-left:10px;letter-spacing:0;font-weight:600}
.cover-top .emb{position:absolute;right:14mm;top:11mm;background:#fff;border-radius:50%;padding:5px;box-shadow:0 6px 16px rgba(11,37,69,.18),0 0 0 3px rgba(201,162,39,.85)}
.pgm{margin-top:12px}
.pgm .en{font:700 21px 'Playfair Display',serif}
.pgm .ar{font:700 17px 'Cairo';color:#8a6d0a;direction:rtl;text-align:left;margin-top:2px}
.card{margin:-17mm 14mm 0;position:relative;background:#fff;border-radius:16px;box-shadow:0 14px 34px rgba(11,37,69,.16);padding:15px 18px;border:1px solid var(--line);display:grid;grid-template-columns:1.3fr 1fr;gap:12px 22px}
.fld small{display:block;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}
.fld div{font:700 14px 'Cairo';color:var(--navy);border-bottom:1.5px dotted #b7c1cf;padding:3px 0 4px;min-height:27px;unicode-bidi:plaintext;word-break:break-word}
.fld div.mono{font:700 14.5px 'Cairo';letter-spacing:.1em;font-variant-numeric:tabular-nums}
.fld.sm div{font-size:12px;font-weight:600}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 14mm 0}
.st{border-radius:14px;padding:11px 12px;background:linear-gradient(160deg,#f6f9fc,#eef3f9);border:1px solid var(--line);position:relative;overflow:hidden}
.st::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--teal))}
.st b{display:block;font:800 25px 'Playfair Display',serif;color:var(--navy);line-height:1}
.st span{display:block;font-size:9.5px;color:var(--mute);margin-top:5px;font-weight:600;letter-spacing:.03em}
.sec{font:700 12px 'Playfair Display',serif;color:var(--navy);margin:16px 14mm 8px;display:flex;align-items:center;gap:9px}
.sec::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.sec i{font:600 10px 'Cairo';color:var(--mute);font-style:normal;margin-left:2px}
.legend{display:flex;gap:14px;margin:0 14mm 8px;font-size:9.5px;color:var(--mute);font-weight:600}
.legend span::before{content:'';display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}
.chart{margin:0 14mm;display:flex;flex-direction:column;gap:6px}
.cr{display:grid;grid-template-columns:44px 1fr 74px;align-items:center;gap:9px;font-size:10px}
.cr .lb{font-weight:700;color:var(--navy)}
.cr .tr{display:flex;height:17px;border-radius:6px;overflow:hidden;background:#eef2f7}
.cr .tr i{display:grid;place-items:center;color:#fff;font:700 8.5px 'Cairo';font-style:normal;min-width:0}
.cr .v{text-align:right;color:var(--mute);font-weight:600;font-variant-numeric:tabular-nums}
.cr .v b{color:var(--navy)}

/* semester table */
.lvl{display:flex;align-items:flex-end;justify-content:space-between;margin:4px 0 10px}
.lvl h3{margin:0;font:800 24px 'Playfair Display',serif;color:var(--navy);letter-spacing:.3px}
.lvl h3 small{display:block;font:600 11px 'Cairo';color:var(--teal);letter-spacing:.2em;text-transform:uppercase;margin-bottom:2px}
.lvl .ar{font:700 17px 'Cairo';color:var(--gold);direction:rtl}
.sem{margin-bottom:13px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff}
.sh{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:#e4e8ee;color:var(--navy);border-bottom:2px solid var(--gold)}
.sh b{font:700 12.5px 'Playfair Display',serif}
.sh b em{font:700 11px 'Cairo';font-style:normal;color:#8a6d0a;margin-left:9px}
.sh span{font-size:9.5px;letter-spacing:.08em;color:#4a5a6e;font-weight:600}
.sh span u{text-decoration:none;color:#8a6d0a;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:9.6px}
th{background:#f7f9fb;color:var(--navy);font-weight:700;padding:5px 4px;text-align:center;border-bottom:2px solid var(--gold);font-size:8.6px;letter-spacing:.04em;line-height:1.2}
th small{display:block;font-weight:500;color:var(--mute);font-size:7.6px;letter-spacing:0}
th.h{--c:var(--cL)}
th.h i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:3px}
td{padding:5px 4px;text-align:center;border-bottom:1px solid #eef1f5;font-variant-numeric:tabular-nums}
tbody tr:nth-child(even){background:#fafbfd}
td.n{color:var(--mute);width:20px}
td.code{font-weight:700;color:var(--navy);white-space:nowrap;font-size:9px}
td.cn{text-align:left;font-weight:600;line-height:1.25}
td.cn small{display:block;font-weight:400;color:var(--mute);font-size:7.8px;margin-top:1px}
td.dim{color:#b5bfcc}
td.wk{font-weight:800;color:var(--navy)}
td.tot{font-weight:800;background:rgba(201,162,39,.13);color:#7a5c00}
td.cr2{font-weight:700}
.tag{display:inline-block;margin-top:2px;font:700 7.4px 'Cairo';font-style:normal;letter-spacing:.06em;padding:1px 7px;border-radius:99px;background:rgba(214,69,93,.12);color:var(--cF);text-transform:uppercase}
tr.fld-tr td.cn{color:#8a2438}
tr.el td.cn{font-style:italic;color:#2b4766}
tfoot td{background:#e4e8ee;color:var(--navy);font-weight:800;border:0;border-top:2px solid var(--gold);padding:6px 4px}
tfoot td.tot{background:var(--gold);color:var(--navy)}
tfoot td:first-child{text-align:left;padding-left:12px;letter-spacing:.1em;font-size:8.6px}
.fn{font-size:8.3px;color:var(--mute);margin:0 2px 8px;line-height:1.5}

/* summary page */
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.box{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.box h4{margin:0 0 7px;font:700 11.5px 'Playfair Display',serif;color:var(--navy)}
.box h4 span{font:700 11px 'Cairo';color:var(--gold);float:right;direction:rtl}
.gt{width:100%;font-size:8.8px}
.gt td,.gt th{padding:3.5px 4px}
.rules{margin:0;padding:0;list-style:none;font-size:8.7px;line-height:1.45}
.rules li{padding:3.5px 0;border-bottom:1px dashed #e6eaf0;display:flex;justify-content:space-between;gap:10px}
.rules li:last-child{border:0}
.rules b{color:var(--navy);white-space:nowrap}
.rules span{direction:rtl;color:var(--mute);text-align:right}
.sigs{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:26px;padding:0 14mm 9px}
.sigs div{text-align:center;font-size:8.4px;color:var(--mute);padding-top:24px;border-top:1.3px solid var(--navy);line-height:1.35}
.sigs b{display:block;color:var(--navy);font-size:9.4px}
.ft{margin-top:0!important}
.wm{position:absolute;right:-30mm;bottom:20mm;opacity:.035;pointer-events:none}

@media(max-width:1000px){.app{grid-template-columns:1fr}.panel{position:relative;height:auto}}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .app{display:block}.panel{display:none}
  .stage{padding:0}
  html,body,.sheet,.sheet *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .sheets{zoom:1!important;gap:0;display:block}
  .sheet{box-shadow:none;break-after:page;page-break-after:always}
  .sheet:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div class="brand">
      <div class="lg" id="lg"></div>
      <h1>الساعات التدريسية<small>Faculty of Applied Health Sciences Technology · Beni-Suef University</small></h1>
    </div>

    <div class="step"><label for="nm"><span class="no">1</span>اسم الطالب</label>
      <input type="text" id="nm" placeholder="اكتب اسم الطالب بالكامل" autocomplete="off"></div>

    <div class="step"><label for="nid"><span class="no">2</span>الرقم القومي</label>
      <input type="text" id="nid" inputmode="numeric" placeholder="14 رقم" autocomplete="off" maxlength="22">
      <div class="hint" id="nidh"></div></div>

    <div class="step"><div class="lb"><span class="no">3</span>نوع الدراسة</div>
      <div class="seg" id="seg"><button data-t="regular" class="on">انتظام</button><button data-t="special">برنامج خاص</button></div></div>

    <div class="step"><div class="lb"><span class="no">4</span>البرنامج / الشعبة</div>
      <div class="progs" id="progs"></div></div>

    <div class="step"><label for="wk"><span class="no">5</span>عدد أسابيع الترم</label>
      <input type="number" id="wk" min="1" max="30" value="15"></div>

    <button class="btn" id="pr">🖨️ طباعة / حفظ PDF</button>
    <div class="note">في نافذة الطباعة اختار <b>Save as PDF</b> (الألوان والخلفيات بتتطبع تلقائي). الملف بيطلع A4 جاهز: غلاف + 4 مستويات + ملخص ولائحة.</div>
    <div class="mini" id="mini"></div>
  </aside>
  <main class="stage"><div class="sheets" id="sheets"></div></main>
</div>

{id:'TML',a:'#a9b8ff',ar:'تكنولوجيا المختبرات الطبية',en:'Technology of Medical Laboratories',sem:{

const emblem=(sz)=>`<img src="${LOGO}" width="${sz}" height="${sz}" alt="Beni-Suef University" style="display:block;object-fit:contain">`;

const P=()=>PROGRAMS.find(p=>p.id===state.prog);

function stuBar(pg){const d=parseNID(state.nid).d;return `<div class="stu"><span class="pgr"><small>Department · القسم</small><b dir="auto">${pg.en} — ${pg.ar}</b><em class="tg" style="font-style:normal">${trk().en} · ${trk().ar}</em></span><span><small>Student · الطالب</small><b dir="auto">${state.name?esc(state.name):'&nbsp;'}</b></span><span class="id"><small>National ID · الرقم القومي</small><b dir="ltr">${d?esc(fmtNID(d)):'&nbsp;'}</b></span></div>`}
function hdr(pg,right){return `<div class="bar"></div><div class="hd"><div class="l">${emblem(34)}<div><div class="t1">${COLLEGE}</div><div class="t2">${UNI} · Teaching Hours Plan</div></div></div><div style="display:flex;gap:7px;align-items:center"><span class="chip g">${pg.id}</span><span class="chip">${right}</span></div></div>${stuBar(pg)}`}
function ftr(n,N){const dt=new Date();return `<div class="ft"><span><b>${COLLEGE}</b> · ${UNI} · Credit-Hour Bylaw 2020/2021</span><span>Issued ${dt.getDate()} ${MON_EN[dt.getMonth()]} ${dt.getFullYear()} · Page <b>${n}</b> / ${N}</span></div>`}

function sigs(){return `<div class="sigs"><div><b>Graduates Affairs</b>شئون الخريجين</div><div><b>Academic Advisor</b>المرشد الأكاديمي</div><div><b>Vice Dean for Education &amp; Students</b>وكيل الكلية لشئون التعليم والطلاب</div></div>`}

function semTable(pg,s){
  const list=semList(pg,s),W=state.W,S=sums(list,W);
  const fall=s%2===1;
  let hasF=false;
  const rows=list.map((x,i)=>{
    const wk=x.l+x.p+x.t+x.f,k=cred(x);
    if(x.f)hasF=true;
    const z=v=>v?v:'<span class="dim">–</span>';
    return `<tr class="${x.f?'fld-tr':''} ${x.e?'el':''}"><td class="n">${i+1}</td><td class="code">${esc(x.k)}</td><td class="cn">${esc(x.n)}${x.note?`<small>${esc(x.note)}</small>`:''}${x.f?'<br><em class="tag">Field training · Pass / Fail</em>':''}</td><td>${z(x.l)}</td><td>${z(x.p)}</td><td>${z(x.t)}</td><td>${z(x.f)}</td><td class="wk">${wk}</td><td class="tot">${wk*W}</td><td class="cr2">${k}</td><td>${x.f?'—*':k*50}</td></tr>`}).join('');
  return `<div class="sem"><div class="sh"><b>${ORD[s-1]} Semester<em>الفصل الدراسي ${ORD_AR[s-1]}</em></b><span>${fall?'FALL · خريف':'SPRING · ربيع'} · <u>${W} WEEKS</u></span></div>
  <table><thead><tr><th>#</th><th>Code</th><th style="text-align:left">Course Title</th>
  <th class="h" style="--c:var(--cL)"><i></i>L<small>Lecture</small></th><th class="h" style="--c:var(--cP)"><i></i>P<small>Practical</small></th><th class="h" style="--c:var(--cT)"><i></i>T<small>Tutorial</small></th><th class="h" style="--c:var(--cF)"><i></i>F<small>Field</small></th>
  <th>Weekly<small>hrs / wk</small></th><th>Total<small>× ${W} weeks</small></th><th>Credit<small>hours</small></th><th>Marks<small>درجات</small></th></tr></thead>
  <tbody>${rows}</tbody>
  <tfoot><tr><td colspan="3">SEMESTER TOTAL · ${S.n} COURSES</td><td>${S.L}</td><td>${S.P}</td><td>${S.T}</td><td>${S.F}</td><td>${S.wk}</td><td class="tot">${S.tot}</td><td>${S.cr}</td><td>${S.mk}</td></tr></tfoot></table></div>${hasF?'<div class="fn">* Field training is a pass/fail course; it is not added to the total marks and does not enter the GPA, but passing it is a graduation requirement.</div>':''}`;
}

function levelPage(pg,lv,n,N){
  return `<section class="sheet">${hdr(pg,'LEVEL '+lv)}<div class="body">
  <div class="lvl"><h3><small>Academic Year ${lv}</small>${ORD[lv-1]} Level</h3><div class="ar">${LV_AR[lv-1]}</div></div>
  ${semTable(pg,lv*2-1)}${semTable(pg,lv*2)}</div>${sigs()}${ftr(n,N)}</section>`;
}

function allSums(pg){const out=[];for(let s=1;s<=8;s++)out.push(sums(semList(pg,s),state.W));return out}

function coverPage(pg,N){
  const SS=allSums(pg),W=state.W;
  const T=SS.reduce((a,s)=>({cr:a.cr+s.cr,tot:a.tot+s.tot,wk:a.wk+s.wk,n:a.n+s.n,mk:a.mk+s.mk,L:a.L+s.L,P:a.P+s.P,T:a.T+s.T,F:a.F+s.F}),{cr:0,tot:0,wk:0,n:0,mk:0,L:0,P:0,T:0,F:0});
  const nid=parseNID(state.nid);
  const idShow=nid.len?fmtNID(nid.d):'';
  const maxW=Math.max(...SS.map(s=>s.wk));
  const bars=SS.map((s,i)=>{
    const seg=(v,c)=>v?`<i style="flex:${v};background:${c}">${v}</i>`:'';
    return `<div class="cr"><span class="lb">Sem ${i+1}</span><div class="tr" style="width:${s.wk/maxW*100}%">${seg(s.L,'var(--cL)')}${seg(s.P,'var(--cP)')}${seg(s.T,'var(--cT)')}${seg(s.F,'var(--cF)')}</div><span class="v"><b>${s.wk}</b> h/wk · ${s.cr} cr</span></div>`}).join('');
  const blank='&nbsp;';
  return `<section class="sheet">
  <div class="cover-top"><div class="emb">${emblem(78)}</div>
    <div class="eyebrow">${UNI}</div>
    <h1>${COLLEGE}</h1>
    <div class="rule"></div>
    <div class="ttl">Teaching Hours Plan <span>خطة الساعات التدريسية</span></div>
    <div class="pgm"><div class="en">${pg.en}</div><div class="ar">${pg.ar}</div></div>
  </div>
  <div class="card">
    <div class="fld"><small>Student Name · اسم الطالب</small><div dir="auto">${state.name?esc(state.name):blank}</div></div>
    <div class="fld"><small>National ID · الرقم القومي</small><div class="mono">${idShow?esc(idShow):blank}</div></div>
    <div class="fld sm"><small>Program · البرنامج</small><div>${pg.en} — ${pg.id}</div></div>
    <div class="fld sm"><small>Study Track · نوع الدراسة</small><div>${trk().en} · ${trk().ar}</div></div>
    <div class="fld sm"><small>${nid.valid?'Date of Birth · Gender · Governorate':'Date of Birth · Gender'}</small><div>${nid.valid?`${fmtDate(nid,MON_EN)} · ${nid.male?'Male':'Female'} · ${nid.gov[1]}`:blank}</div></div>
  </div>
  <div class="cgrid">
    <div class="st" style="--c:var(--gold)"><b>${T.cr}</b><span>TOTAL CREDIT HOURS</span></div>
    <div class="st" style="--c:var(--teal)"><b>${T.tot.toLocaleString('en')}</b><span>TEACHING HOURS · ${W} WKS/SEM</span></div>
    <div class="st" style="--c:var(--cP)"><b>8</b><span>SEMESTERS · 4 LEVELS</span></div>
    <div class="st" style="--c:var(--cF)"><b>${T.n}</b><span>COURSES INCL. ELECTIVES</span></div>
  </div>
  <div class="sec">Weekly contact hours by semester <i>الساعات الأسبوعية لكل فصل</i></div>
  <div class="legend"><span style="--c:var(--cL)">Lecture (L)</span><span style="--c:var(--cP)">Practical (P)</span><span style="--c:var(--cT)">Tutorial (T)</span><span style="--c:var(--cF)">Field training (F)</span></div>
  <div class="chart">${bars}</div>
  <div class="sec">How teaching hours are calculated <i>طريقة الحساب</i></div>
  <div class="cgrid" style="grid-template-columns:repeat(4,1fr);margin-top:0">
    <div class="st" style="--c:var(--cL)"><b style="font-size:15px">1 L</b><span>= 1 credit hour</span></div>
    <div class="st" style="--c:var(--cP)"><b style="font-size:15px">2 P</b><span>= 1 credit hour</span></div>
    <div class="st" style="--c:var(--cT)"><b style="font-size:15px">2 T</b><span>= 1 credit hour</span></div>
    <div class="st" style="--c:var(--cF)"><b style="font-size:15px">4 F</b><span>= 1 credit hour</span></div>
  </div>
  <div class="fn" style="margin:7px 14mm 0">Course teaching hours = (L + P + T + F) per week × ${W} weeks. Semester and program totals are the sums of their courses.</div>
  ${sigs()}${ftr(1,N)}</section>`;
}

function summaryPage(pg,n,N){
  const SS=allSums(pg),W=state.W;
  const tot=SS.reduce((a,s)=>({cr:a.cr+s.cr,tot:a.tot+s.tot,wk:a.wk+s.wk,n:a.n+s.n,mk:a.mk+s.mk,L:a.L+s.L,P:a.P+s.P,T:a.T+s.T,F:a.F+s.F}),{cr:0,tot:0,wk:0,n:0,mk:0,L:0,P:0,T:0,F:0});
  const rows=SS.map((s,i)=>`<tr><td class="code">Semester ${i+1}</td><td>${ORD[Math.floor(i/2)]}</td><td>${s.n}</td><td>${s.L}</td><td>${s.P}</td><td>${s.T}</td><td>${s.F}</td><td class="wk">${s.wk}</td><td class="tot">${s.tot}</td><td class="cr2">${s.cr}</td><td>${s.mk}</td></tr>`).join('');
  const rules=[
    ['Credit hour','1 L = 2 P = 2 T = 4 F per 15-week semester','الساعة المعتمدة'],
    ['Graduation','130 credit hours · GPA ≥ 2.00 · pass field training','متطلبات التخرج'],
    ['Study load','12 – 18 credit hours per semester','العبء الدراسي'],
    ['Attendance','Max 25% unexcused absence, otherwise “Deprived”','المواظبة'],
    ['Withdrawal','Until the end of week 6, with advisor approval','الانسحاب'],
    ['Probation','GPA < 2.00 → academic probation, max 4 semesters','المراقبة الأكاديمية'],
    ['Honors','GPA ≥ 3.25 with no failed course','مرتبة الشرف'],
    ['Assessment','Final 80% / Mid 10% / Coursework 10% (theory-only); with practical: 40/10/10/40','نظام التقييم']
  ].map(r=>`<li><div><b>${r[0]}</b> — ${r[1]}</div><span>${r[2]}</span></li>`).join('');
  const gr=[['A+','90 – 100','3.5 – 4.0','Excellent'],['A','85 – <90','3.25 – 3.5','Excellent'],['B','75 – <85','2.75 – 3.25','Very Good'],['C','65 – <75','2.25 – 2.75','Good'],['D','60 – <65','2.0 – 2.25','Pass'],['F','< 60','0.0','Fail']]
    .map(r=>`<tr><td class="code">${r[0]}</td><td>${r[1]}%</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('');
  return `<section class="sheet">${hdr(pg,'SUMMARY')}<div class="body">
  <div class="lvl"><h3><small>Program totals</small>Study Plan Summary</h3><div class="ar">ملخص الخطة الدراسية</div></div>
  <div class="sem"><div class="sh"><b>${pg.en}<em>${pg.ar}</em></b><span><u>${W} WEEKS</u> / SEMESTER</span></div>
  <table><thead><tr><th>Semester</th><th>Level</th><th>Courses</th><th>L</th><th>P</th><th>T</th><th>F</th><th>Weekly<small>hrs / wk</small></th><th>Total<small>× ${W} weeks</small></th><th>Credit<small>hours</small></th><th>Marks</th></tr></thead>
  <tbody>${rows}</tbody>
  <tfoot><tr><td colspan="2">PROGRAM TOTAL</td><td>${tot.n}</td><td>${tot.L}</td><td>${tot.P}</td><td>${tot.T}</td><td>${tot.F}</td><td>${tot.wk}</td><td class="tot">${tot.tot.toLocaleString('en')}</td><td>${tot.cr}</td><td>${tot.mk.toLocaleString('en')}</td></tr></tfoot></table></div>
  <div class="two">
    <div class="box"><h4>Grading scale<span>نظام التقدير</span></h4><table class="gt"><thead><tr><th>Grade</th><th>Percentage</th><th>Points</th><th>Rating</th></tr></thead><tbody>${gr}</tbody></table>
      <div class="fn" style="margin:6px 0 0">W = Withdrawn · IC = Incomplete · GPA = Σ(points × credit hours) ÷ Σ credit hours.</div></div>
    <div class="box"><h4>Key regulations<span>أهم أحكام اللائحة</span></h4><ul class="rules">${rules}</ul></div>
  </div>
  </div>${sigs()}${ftr(n,N)}</section>`;
}

function render(){
  const pg=P(),N=6;
  $('sheets').innerHTML=coverPage(pg,N)+[1,2,3,4].map(l=>levelPage(pg,l,l+1,N)).join('')+summaryPage(pg,6,N);
  const SS=allSums(pg);
  const cr=SS.reduce((a,s)=>a+s.cr,0),h=SS.reduce((a,s)=>a+s.tot,0);
  $('mini').innerHTML=`<div><b>${cr}</b><span>ساعة معتمدة</span></div><div><b>${h.toLocaleString('en')}</b><span>ساعة تدريس إجمالي</span></div>`;
  document.title=`Teaching Hours – ${pg.id} – ${trk().en}${state.name?' – '+state.name:''}`;
  document.querySelectorAll('.pc').forEach(b=>b.classList.toggle('on',b.dataset.id===state.prog));
  fit();
}
function fit(){
  const st=document.querySelector('.stage'),el=$('sheets');
  const w=st.clientWidth-32,k=Math.min(1,w/794);
  el.style.zoom=k<1?k:1;
}

/* ---- wiring ---- */
$('lg').innerHTML=emblem(48);
(function(){const l=document.createElement('link');l.rel='icon';l.href=LOGO;document.head.appendChild(l)})();
$('progs').innerHTML=PROGRAMS.map(p=>`<button class="pc" data-id="${p.id}" style="--a:${p.a}"><span class="cd">${p.id}</span><b>${p.ar}</b></button>`).join('');
$('progs').addEventListener('click',e=>{const b=e.target.closest('.pc');if(!b)return;state.prog=b.dataset.id;render()});
$('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.track=b.dataset.t;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));render()});
$('nm').addEventListener('input',e=>{state.name=e.target.value.trim();render()});
$('nid').addEventListener('input',e=>{
  state.nid=e.target.value;const r=parseNID(state.nid),h=$('nidh');
  if(!r.len){h.className='hint';h.textContent=''}
  else if(r.len<14){h.className='hint';h.textContent=`${r.len} / 14`}
  else if(r.len>14){h.className='hint bad';h.textContent='الرقم أكتر من 14 رقم'}
  else if(!r.valid){h.className='hint bad';h.textContent='الرقم القومي غير صحيح — راجع الأرقام'}
  else{h.className='hint ok';h.textContent=`✓ صحيح · مواليد ${fmtDate(r,MON_AR)} · ${r.male?'ذكر':'أنثى'} · ${r.gov[0]}`}
  render();
});
$('wk').addEventListener('input',e=>{const v=Math.max(1,Math.min(30,parseInt(e.target.value)||15));state.W=v;render()});
$('pr').addEventListener('click',()=>window.print());
window.addEventListener('beforeprint',()=>{$('sheets').style.zoom=1});
window.addEventListener('afterprint',fit);
window.addEventListener('resize',fit);
render();
</script>
</body>
</html>
